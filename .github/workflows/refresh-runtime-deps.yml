name: Refresh runtime dependencies

on:
  push:
    branches: [security/hardening-2026-08-29]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[deps-refresh]') }}
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      ADMIN_USER: admin-ci
      ADMIN_PASSWORD: $2a$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi
      ADMIN_PLAIN_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/hardening-2026-08-29

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh dependency tree
        run: |
          npm audit fix || true
          npm ci
          npm run lint
          npm test -- --runInBand
          npm run build

      - name: Commit refreshed lockfile and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-runtime-deps.yml
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: refresh runtime dependency tree [deps-refresh]"
          git push origin HEAD:security/hardening-2026-08-29
