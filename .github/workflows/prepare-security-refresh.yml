name: Prepare security refresh

on:
  push:
    branches: [security/hardening-2026-08-29]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      ADMIN_USER: admin-ci
      ADMIN_PASSWORD: $2a$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi
      ADMIN_PLAIN_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh and validate
        run: |
          npm install
          npm audit fix || true
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm test -- --runInBand
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboat-security-refresh
          path: |
            package.json
            package-lock.json
